name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by release.yml, which calls this workflow
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25 # matches gradle/gradle-daemon-jvm.properties

      - uses: gradle/actions/setup-gradle@v5

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Check the public API against signalr/api/signalr.api
        run: ./gradlew :signalr:apiCheck --console=plain

      - name: Build library release AAR
        run: ./gradlew :signalr:assembleRelease --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
